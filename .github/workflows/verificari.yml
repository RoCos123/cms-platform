# Verificările care rulau până acum doar dacă îmi aduceam eu aminte.
#
# Cerut de proprietar pe 27 aug. 2026, după întrebarea „dacă se strică ceva, se
# strică toate site-urile?". Răspunsul cinstit era: build-ul stricat nu iese, iar
# Vercel dă înapoi dintr-un clic — dar nimeni nu verifica automat că probele
# trec. Adică apărarea era o promisiune, nu o garanție.
#
# Ce NU acoperă, ca să nu creadă nimeni altceva:
#   - cum ARATĂ site-ul. Aia rămâne verificare vizuală cu capturi, de mână.
name: Verificări

on:
  push:
    branches: [master]
  pull_request:

# O trimitere nouă oprește verificarea celei vechi pe aceeași ramură: la a treia
# corectură la rând, primele două nu mai interesează pe nimeni.
concurrency:
  group: verificari-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Versiunea vine din `packageManager` din package.json, ca să nu fie
      # scrisă în două locuri.
      - uses: pnpm/action-setup@v4

      # 22, nu mai puțin: probele importă direct fișiere `.ts`, iar Node știe
      # să le citească singur abia de la 22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pași separați, nu unul singur: X-ul roșu trebuie să spună CE a picat,
      # nu doar că ceva a picat.
      - name: Lint
        run: pnpm lint

      # `pnpm typecheck` cheamă întâi `next typegen`, fiindcă `LayoutProps` și
      # celelalte tipuri de rute sunt GENERATE de Next în `.next/types/`. Pe o
      # mașină de lucru există din build-urile anterioare, pe o clonă curată nu —
      # deci verificarea trecea local și pica aici. Prima rulare a workflow-ului
      # a picat exact așa, ceea ce e și dovada că CI-ul vede ce eu nu văd.
      - name: Tipuri
        run: pnpm typecheck

      - name: Probe de logică
        run: pnpm test:logica

      - name: Build
        run: pnpm build

  # ==========================================================================
  # Migrările SQL, rulate pe un Postgres gol, de la zero.
  #
  # DE CE E UN JOB SEPARAT. N-are nevoie de Node, de pnpm și nici de build;
  # rulează în paralel cu celălalt, iar X-ul roșu spune limpede că problema e în
  # SQL, nu în cod.
  #
  # DE CE CONTEAZĂ MAI MULT DECÂT PARE. Migrările se rulează de MÂNĂ, de
  # proprietar, pe baza reală a tuturor clienților. E singura operație din tot
  # sistemul care lovește pe toată lumea deodată și nu se poate da înapoi. Până
  # acum, singura probă că o migrare se aplică era că mi-o aminteam eu s-o rulez
  # pe bancul local — adică o promisiune, nu o garanție. Chiar pe 8 sept. 2026 o
  # migrare a plecat cu două lucruri rupte, găsite abia fiindcă am rulat-o.
  #
  # Bancul face trei lucruri, în ordine: aplică TOATE migrările pe o bază goală,
  # provizionează un client cu `creeaza_client` ca la un client adevărat, apoi
  # trece cele treisprezece verificări de izolare. Iese cu 1 dacă vreuna dă
  # PICAT sau NECONCLUDENT.
  # ==========================================================================
  migrari:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Imaginea de Ubuntu de la GitHub vine cu PostgreSQL, dar asta e o
      # presupunere despre mediul altcuiva — genul de lucru care se schimbă
      # într-o zi fără să anunțe nimeni. Îl instalăm doar dacă lipsește: de
      # obicei pasul ăsta nu face nimic, iar în ziua în care imaginea se
      # schimbă, salvează verificarea în loc s-o rupă.
      - name: Postgres, dacă nu e deja
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql postgresql-client
          fi
          ls -d /usr/lib/postgresql/*/bin

      # `sudo`: bancul pornește un Postgres propriu, ceea ce cere scrierea în
      # /var/lib/postgresql și rularea ca utilizatorul `postgres`.
      - name: Migrări și verificări de izolare
        run: sudo bash supabase/proba-locala.sh

      # ----------------------------------------------------------------------
      # Amprenta schemei e la zi?
      #
      # Bancul rescrie `supabase/verificare-schema.sql` din baza pe care tocmai
      # a construit-o. Dacă fișierul comis diferă, cineva a schimbat o migrare
      # fără să regenereze — iar fișierul cu care se verifică baza reală ar fi
      # rămas să spună „totul e la fel" despre o schemă care nu mai e aia.
      #
      # DE CE SE SARE PESTE, LA ALTĂ VERSIUNE MAJORĂ. O parte din amprentă
      # (constrângeri, indecși, politici) e text pe care Postgres îl recompune
      # singur și îl poate scrie altfel de la o versiune la alta. În ziua în
      # care imaginea GitHub trece pe alt Postgres, comparația asta ar da roșu
      # pe cod bun — iar un CI care dă roșu pe cod bun se ignoră în două
      # săptămâni. Atunci se regenerează local pe versiunea nouă, o dată.
      # ----------------------------------------------------------------------
      - name: Amprenta schemei e la zi
        run: |
          FISIER=supabase/verificare-schema.sql
          MAJOR_AMPRENTA=$(sed -n 's/.*luată pe PostgreSQL \([0-9]\{1,\}\).*/\1/p' "$FISIER" | head -1)
          MAJOR_AICI=$(ls -d /usr/lib/postgresql/*/bin | sed 's|.*/postgresql/||; s|/bin||' | sort -V | tail -1)

          if [ "$MAJOR_AMPRENTA" != "$MAJOR_AICI" ]; then
            echo "Amprenta e luată pe PostgreSQL $MAJOR_AMPRENTA, aici e $MAJOR_AICI."
            echo "Sar peste comparație: diferențele ar fi de scriere, nu de schemă."
            exit 0
          fi

          if ! git diff --exit-code -- "$FISIER"; then
            echo
            echo "$FISIER nu mai e la zi cu migrările."
            echo "Rulează local  bash supabase/proba-locala.sh  și comite fișierul rescris."
            exit 1
          fi
          echo "Amprenta e la zi (PostgreSQL $MAJOR_AICI)."
